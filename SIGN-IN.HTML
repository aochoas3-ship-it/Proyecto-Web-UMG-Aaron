<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Gran Vida</title>
    <!-- Enlazamos el mismo CSS para mantener el diseño -->
    <link rel="stylesheet" href="CSS/Style.css"> 

</head>
<body class="body-sign-in">

    <div class="contenedor-sign-in">
        <div class="sign-in-box">
            <h2>Registrarse</h2>
            <form>
                <div class="input-group">
                    <label for="usuario">Nombre:</label>
                    <input type="text" id="usuario" placeholder="Ingrese su Nombre" required>
                </div>
                <div class="input-group">
                    <label for="usuario">Correo:</label>
                    <input type="text" id="usuario" placeholder="Ingrese su Correo" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Ingrese su Contraseña" required>
                </div>
                <div class="input-group">
                    <label for="password">Confirmar Contraseña:</label>
                    <input type="password" id="password" placeholder="Confirme su Contraseña" required>
                </div>
                <button type="submit" class="btn-submit">Registraerme</button>
            </form>
            <!-- Un enlace sencillo para regresar a la página principal -->
            <a href="INDEX.html" class="btn-regresar">← Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
