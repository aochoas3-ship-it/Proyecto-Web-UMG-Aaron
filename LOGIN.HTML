<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Gran Vida</title>
    <!-- Enlazamos el mismo CSS para mantener el diseño -->
    <link rel="stylesheet" href="CSS/Style.css"> 
</head>
<body class="body-login">

    <div class="contenedor-login">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form>
                <div class="input-group">
                    <label for="usuario">Usuario o Correo:</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Ingrese Contraseña" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <!-- Contenedor flexbox para alinear los enlaces uno a la par del otro -->
            <div class="links-container">
                <a href="SIGN-IN.HTML" class="btn-registrar">Registrarme</a>
                <a href="FORGET-PASSWORD.HTML" class="btn-contraseña-olvidada">Olvidé mi contraseña</a>
            </div>

        </div>
    </div>

</body>
</html>
